<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Auralis — Coming September 2026</title>
  <meta name="description" content="Auralis is taking off. Coming September 2026." />
  <style>
    :root{
      --bg:#0b0b0c;
      --fg:#f5f3ef;
      --muted:#aaa7a1;
      --line:rgba(255,255,255,.12);
      --accent:#f3eee5;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
    body{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      position:relative;
    }
    body::before{
      content:"";
      position:absolute;
      inset:-20%;
      background:
        radial-gradient(circle at 75% 25%, rgba(255,255,255,.08), transparent 25%),
        radial-gradient(circle at 20% 80%, rgba(255,255,255,.04), transparent 30%);
      pointer-events:none;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:28px 38px;
      border-bottom:1px solid var(--line);
      position:relative;
      z-index:1;
    }
    .brand{
      font-family:Georgia,"Times New Roman",serif;
      font-size:30px;
      letter-spacing:-1px;
    }
    .status{
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:2px;
      color:var(--muted);
    }
    main{
      flex:1;
      display:flex;
      align-items:center;
      padding:48px 7vw 70px;
      position:relative;
      z-index:1;
    }
    .wrap{max-width:980px}
    .eyebrow{
      font-size:13px;
      letter-spacing:3px;
      text-transform:uppercase;
      color:var(--muted);
      margin-bottom:26px;
    }
    h1{
      margin:0;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(58px,9vw,132px);
      line-height:.88;
      font-weight:400;
      letter-spacing:-5px;
      max-width:1000px;
    }
    .sub{
      margin-top:36px;
      max-width:620px;
      font-size:clamp(18px,2vw,27px);
      line-height:1.35;
      color:#d7d3cc;
    }
    .date{
      display:inline-flex;
      align-items:center;
      gap:12px;
      margin-top:38px;
      padding:13px 17px;
      border:1px solid var(--line);
      border-radius:999px;
      font-size:14px;
      letter-spacing:.5px;
      background:rgba(255,255,255,.02);
      backdrop-filter:blur(8px);
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 18px rgba(255,255,255,.5);
    }
    footer{
      display:flex;
      justify-content:space-between;
      gap:20px;
      padding:24px 38px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
      position:relative;
      z-index:1;
    }
    footer a{color:var(--fg);text-decoration:none}
    footer a:hover{text-decoration:underline}
    @media (max-width:700px){
      header{padding:22px 22px}
      .brand{font-size:26px}
      .status{display:none}
      main{padding:46px 22px 60px;align-items:center}
      h1{letter-spacing:-3px}
      .sub{margin-top:28px}
      footer{padding:20px 22px;flex-direction:column}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Auralis</div>
    <div class="status">Launching soon</div>
  </header>

  <main>
    <section class="wrap">
      <div class="eyebrow">Private flying, reimagined</div>
      <h1>We’re taking off.</h1>
      <p class="sub">
        A new way to access private flights is coming.
        See you in September.
      </p>
      <div class="date">
        <span class="dot"></span>
        September 2026
      </div>
    </section>
  </main>

  <footer>
    <span>© 2026 Auralis</span>
    <a href="mailto:contatti@auralisair.it">contatti@auralisair.it</a>
  </footer>
</body>
</html>
